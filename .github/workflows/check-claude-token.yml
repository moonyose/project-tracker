name: Check the Claude subscription token

# Run by hand (Actions -> Check the Claude subscription token -> Run workflow) to confirm the
# CLAUDE_CODE_OAUTH_TOKEN secret works before the bot needs it. Sends one tiny request on
# Austin's Claude subscription and prints only whether it worked (this repo's logs are public).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code >/dev/null 2>&1 && claude --version
      - name: One tiny request on the subscription
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DISABLE_TELEMETRY: "1"
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then echo "::error::The CLAUDE_CODE_OAUTH_TOKEN secret isn't set."; exit 1; fi
          unset ANTHROPIC_API_KEY
          check() {  # $1 = model
            claude -p "Reply with the single word OK." --model "$1" --max-turns 1 --output-format json \
              > "$RUNNER_TEMP/out.json" 2> "$RUNNER_TEMP/err.txt" || true
            python3 - "$RUNNER_TEMP/out.json" "$1" <<'PY'
          import json, sys
          try:
              o = json.load(open(sys.argv[1]))
          except Exception:
              print(f"{sys.argv[2]}: no usable reply"); sys.exit(1)
          if o.get("is_error"):
              print(f"{sys.argv[2]}: refused ({str(o.get('result', ''))[:120]})"); sys.exit(1)
          print(f"{sys.argv[2]}: works"); sys.exit(0)
          PY
          }
          if check claude-opus-5-5; then
            echo "::notice::The subscription token works, with Opus."
          elif check claude-sonnet-5-5; then
            echo "::notice::The subscription token works, but this plan doesn't include Opus: the bot will use Sonnet."
          else
            echo "::error::The subscription token didn't work. Re-run 'claude setup-token' and update the secret."
            grep -oiE "invalid|expired|unauthori[sz]ed|revoked|authentication[^.]*" "$RUNNER_TEMP/err.txt" | head -2
            exit 1
          fi
