name: Claude works the to-do list

# Runs as soon as the to-do list (data.json) or the bot's settings change on
# main, which is every add or edit on the site. Also every 15 minutes as a
# backup (GitHub often starts scheduled runs late), plus a manual button.
# If nothing new is on the list, the run stops before calling Claude, so it
# costs nothing. That includes the run set off by the bot's own write-back.
on:
  push:
    branches: [main]
    paths:
      - data.json
      - agent/config.json
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: claude-agent
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Quick Linux check first, so the Mac runner only starts when there's new work.
  check:
    runs-on: ubuntu-latest
    outputs:
      has_work: ${{ steps.select.outputs.has_work }}
    steps:
      - uses: actions/checkout@v4
      - id: select
        env:
          QUEUE: /tmp/queue.json
          HAS_KEYS: ${{ (secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '') && secrets.AGENT_GH_TOKEN != '' }}
        run: |
          if [ "$HAS_KEYS" != "true" ]; then
            echo "::notice::Skipping: add AGENT_GH_TOKEN plus ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN to turn the agent on."
            echo "has_work=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          python3 agent/select.py

  work:
    needs: check
    if: needs.check.outputs.has_work == 'true'
    runs-on: macos-latest        # has Xcode + iOS simulators; free on public repos
    timeout-minutes: 150
    env:
      TRACKER: ${{ github.workspace }}/tracker
      WORK: ${{ github.workspace }}/work
      RESULTS: ${{ github.workspace }}/_run/results
      QUEUE: ${{ github.workspace }}/_run/queue.json
      GH_TOKEN: ${{ secrets.AGENT_GH_TOKEN }}
    steps:
      - name: Check out the tracker
        uses: actions/checkout@v4
        with:
          path: tracker
          token: ${{ secrets.AGENT_GH_TOKEN }}

      - name: Pick tasks (free — no Claude yet)
        id: select
        run: |
          mkdir -p "$(dirname "$QUEUE")" "$RESULTS"
          python3 "$TRACKER/agent/select.py"

      - name: Clone the app repos
        id: clone
        if: steps.select.outputs.has_work == 'true'
        run: |
          git config --global user.name "Claude (for Austin)"
          git config --global user.email "noreply@anthropic.com"
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          mkdir -p "$WORK" "$RESULTS"
          missing=""
          for r in ${{ steps.select.outputs.repos }}; do
            name="${r#*/}"
            if git clone -q --filter=blob:limit=20m "https://github.com/$r.git" "$WORK/$name" 2>/dev/null; then
              echo "cloned $r"
            else
              echo "::warning::could not clone $r"; missing="$missing $r"
            fi
          done
          echo "missing=$missing" >> "$GITHUB_OUTPUT"

      - name: Java 17 for Android (Gradle) builds
        if: steps.select.outputs.has_work == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Roblox tools (Rojo, StyLua, Selene, Lune, Luau)
        if: steps.select.outputs.has_work == 'true' && (contains(steps.select.outputs.repos, 'CrashMode') || contains(steps.select.outputs.repos, 'FlyingMachines') || contains(steps.select.outputs.repos, 'PlunderSeas') || contains(steps.select.outputs.repos, 'ZombieRaiders') || contains(steps.select.outputs.repos, 'flying-machines-survival') || contains(steps.select.outputs.repos, 'FlyingMachinesRace'))
        run: |
          for t in rojo stylua selene lune luau; do brew install -q "$t" >/dev/null 2>&1 || echo "::warning::could not install $t"; done
          for t in rojo stylua selene lune; do "$t" --version 2>/dev/null || true; done
          command -v luau || true

      - name: Install Claude Code
        if: steps.select.outputs.has_work == 'true'
        run: npm install -g @anthropic-ai/claude-code >/dev/null 2>&1 && claude --version

      - name: Claude works the queue (Opus, capped at the run budget)
        id: claude
        if: steps.select.outputs.has_work == 'true'
        continue-on-error: true
        env:
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          AUTH: ${{ steps.select.outputs.auth }}
          MODEL: ${{ steps.select.outputs.model }}
          FALLBACK_MODEL: ${{ steps.select.outputs.fallback_model }}
          MISSING: ${{ steps.clone.outputs.missing }}
          CLAUDE_CODE_MAX_SUBAGENT_SPAWN_DEPTH: "2"
          DISABLE_TELEMETRY: "1"
        run: |
          python3 "$TRACKER/agent/render.py" "$RUNNER_TEMP/run"
          cd "$WORK"
          # Output goes to a file, not the log: this repo is public.
          run_claude() {  # $1 = model
            claude -p "$(cat "$RUNNER_TEMP/run/prompt.md")" \
              --model "$1" \
              --agents "$RUNNER_TEMP/run/agents.json" \
              --add-dir "$TRACKER" "$RESULTS" \
              --settings "$TRACKER/agent/permissions.json" \
              --permission-mode dontAsk \
              --permission-prompts none \
              --max-budget-usd "${{ steps.select.outputs.run_budget }}" \
              --max-turns 300 \
              --output-format json \
              > "$RUNNER_TEMP/claude.json" 2> "$RUNNER_TEMP/claude.err" || echo "claude exited with $?"
          }
          said() { grep -qiE "$1" "$RUNNER_TEMP/claude.json" "$RUNNER_TEMP/claude.err" 2>/dev/null; }
          use_subscription() {
            unset ANTHROPIC_API_KEY
            export CLAUDE_CODE_OAUTH_TOKEN="$OAUTH_TOKEN"
            echo subscription > "$RUNNER_TEMP/auth_used"
            run_claude "$MODEL"
            # Opus isn't on every Claude plan: fall back once if the plan refuses it.
            if [ -n "$FALLBACK_MODEL" ] && said "not available with the Claude Pro plan|not available on your plan|model.*not available"; then
              echo "::notice::Opus isn't available on this Claude plan; using $FALLBACK_MODEL."
              run_claude "$FALLBACK_MODEL"
            fi
          }
          if [ "$AUTH" = "api" ] && [ -n "$API_KEY" ]; then
            export ANTHROPIC_API_KEY="$API_KEY"
            echo api > "$RUNNER_TEMP/auth_used"
            run_claude "$MODEL"
            if said "credit balance is too low|credit balance|insufficient credit"; then
              touch "$RUNNER_TEMP/api_exhausted"
              echo "::notice::API credits are used up. Switching to the Claude subscription from now on."
              if [ -n "$OAUTH_TOKEN" ]; then use_subscription; else
                echo "::warning::No CLAUDE_CODE_OAUTH_TOKEN secret, so nothing to switch to. Add it (claude setup-token)."
              fi
            fi
          elif [ -n "$OAUTH_TOKEN" ]; then
            use_subscription
          else
            echo "::warning::Subscription mode but no CLAUDE_CODE_OAUTH_TOKEN secret. Add it (claude setup-token)."
          fi
          ls "$RESULTS" | sed 's/^/result: /'

      - name: Write results back to the to-do list
        if: always() && steps.select.outputs.has_work == 'true'
        run: |
          cd "$TRACKER"
          for i in 1 2 3 4; do
            git fetch -q origin main && git reset -q --hard origin/main
            AUTH_USED="$(cat "$RUNNER_TEMP/auth_used" 2>/dev/null || echo api)" \
            API_EXHAUSTED="$([ -f "$RUNNER_TEMP/api_exhausted" ] && echo 1 || echo 0)" \
              python3 agent/apply_results.py "$QUEUE" "$RESULTS" "$RUNNER_TEMP/claude.json"
            git add data.json agent/ledger.json
            git -c user.name="Claude (for Austin)" -c user.email="noreply@anthropic.com" \
              commit -qm "Agent run: $(ls "$RESULTS" | wc -l | tr -d ' ') task result(s)" || exit 0
            git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          echo "::error::could not push results"; exit 1
